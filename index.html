<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #00adb5;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #00adb5;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #008891;
        }

        .options-group {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .video-preview {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .video-preview img {
            width: 100px;
            border-radius: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: bold;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            width: 100%;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Video Downloader</h1>
    
    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Cole o link do vídeo aqui...">
        <button onclick="fetchInfo()">Buscar</button>
    </div>

    <div class="options-group" id="optionsGroup">
        <div class="video-preview">
            <img id="thumb" src="" alt="Thumbnail">
            <div class="video-title" id="videoTitle"></div>
        </div>

        <div>
            <label for="formatSelect">Formato:</label>
            <select id="formatSelect" onchange="toggleResolutionSelect()">
                <option value="mp4">MP4 (Vídeo)</option>
                <option value="mp3">MP3 (Áudio)</option>
            </select>
        </div>

        <div id="resGroup">
            <label for="resSelect">Resolução:</label>
            <select id="resSelect">
                <!-- Preenchido via JS -->
            </select>
        </div>

        <button onclick="downloadVideo()" style="width: 100%;">Baixar Agora</button>
    </div>

    <div class="status" id="statusText"></div>
</div>

<script>
    const API_URL = 'http://localhost:5000';

    async function fetchInfo() {
        const url = document.getElementById('videoUrl').value.trim();
        const statusText = document.getElementById('statusText');
        const optionsGroup = document.getElementById('optionsGroup');

        if (!url) {
            alert('Por favor, insira uma URL válida.');
            return;
        }

        statusText.textContent = 'Buscando informações do vídeo...';
        optionsGroup.style.display = 'none';

        try {
            const response = await fetch(`${API_URL}/info`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('videoTitle').textContent = data.title;
                
                const resSelect = document.getElementById('resSelect');
                resSelect.innerHTML = '';

                data.formats.forEach(f => {
                    const option = document.createElement('option');
                    option.value = f.resolution;
                    option.textContent = f.resolution;
                    resSelect.appendChild(option);
                });

                optionsGroup.style.display = 'flex';
                statusText.textContent = '';
            } else {
                statusText.textContent = 'Erro ao carregar vídeo: ' + data.error;
            }
        } catch (err) {
            statusText.textContent = 'Erro de conexão com o servidor backend.';
        }
    }

    function toggleResolutionSelect() {
        const format = document.getElementById('formatSelect').value;
        const resGroup = document.getElementById('resGroup');
        resGroup.style.display = format === 'mp3' ? 'none' : 'block';
    }

    async function downloadVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const formatType = document.getElementById('formatSelect').value;
        const resolution = document.getElementById('resSelect').value;
        const statusText = document.getElementById('statusText');

        statusText.textContent = 'Processando o download, aguarde...';

        try {
            const response = await fetch(`${API_URL}/download`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, format_type: formatType, resolution })
            });

            if (response.ok) {
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `video.${formatType}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                statusText.textContent = 'Download concluído!';
            } else {
                statusText.textContent = 'Erro no download.';
            }
        } catch (err) {
            statusText.textContent = 'Erro de conexão no download.';
        }
    }
</script>

</body>
</html>
